<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>今日清单</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">简单一点，完成更多</p>
        <h1>今日清单</h1>
        <p class="subtitle">写下要做的事，一件一件完成。</p>
      </header>

      <form id="todo-form" class="entry">
        <label class="sr-only" for="todo-input">新增待办事项</label>
        <input id="todo-input" name="todo" type="text" placeholder="例如：读书 20 分钟" maxlength="120" required autocomplete="off" />
        <button type="submit">添加</button>
      </form>

      <section class="list-section" aria-label="待办事项">
        <div class="list-heading">
          <h2>我的任务</h2>
          <span id="task-count" aria-live="polite">0 项未完成</span>
        </div>
        <ul id="todo-list"></ul>
        <p id="empty-state" class="empty-state">清单还是空的，添加第一件事吧。</p>
      </section>

      <footer>任务仅保存在此浏览器中。</footer>
    </main>
  </body>
</html>
